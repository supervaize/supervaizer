name: TruffleHog Full Repository Scan

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan Type"
        required: true
        default: "full-repo"
        type: choice
        options:
          - full-repo

jobs:
  full-security-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full git history for complete scanning

      - name: Full Repository Scan
        if: inputs.scan_type == 'full-repo'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --results=verified,unknown
