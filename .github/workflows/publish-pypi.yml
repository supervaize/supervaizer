name: Publish Python Package to PyPI

on:
  push:
    branches:
      - main

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 0: CI gate — skip the whole workflow on release commits ───
  ci:
    if: |
      github.repository == 'supervaize/supervaizer' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    uses: ./.github/workflows/python-package.yml

  # ─── Job 1: Version bump, tag, build, and publish ───
  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/supervaizer
    permissions:
      id-token: write  # required for OIDC trusted publishing
      contents: write  # required for committing version bump

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install bump-my-version
        run: uv tool install bump-my-version

      - name: Determine version bump type
        id: bump-type
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$COMMIT_MESSAGE"
          if echo "$MSG" | grep -qi '\[MAJOR\]'; then PART="major"
          elif echo "$MSG" | grep -qi '\[MINOR\]'; then PART="minor"
          elif echo "$MSG" | grep -qi '\[PATCH\]'; then PART="patch"
          else
            echo "No [MAJOR]/[MINOR]/[PATCH] token — skip bump, publish current version"
            echo "part=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Bump type: $PART"
          echo "part=$PART" >> "$GITHUB_OUTPUT"

      - name: Sync with origin/main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

      - name: Bump version and rotate CHANGELOG
        if: steps.bump-type.outputs.part != 'skip'
        run: |
          HEAD_MSG="$(git log -1 --format=%s)"
          if echo "$HEAD_MSG" | grep -q 'chore(release):'; then
            echo "HEAD is already a release commit after pull — skip bump"
            exit 0
          fi
          bump-my-version bump ${{ steps.bump-type.outputs.part }} \
            --config-file pyproject.toml \
            --verbose
          git push --follow-tags

      - name: Install Hatch
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/gh-release-latest-tag.sh supervaize/supervaizer
